<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>

    <h1>Simple Form</h1>

    <!-- Form loads result.html inside the iframe after submission -->
    <form action="result.html" method="get" target="resultFrame">

        <label for="text">Enter Text:</label>

        <input type="text" id="text" name="text">

        <button type="submit">Submit</button>

    </form>

    <br>

    <iframe
        name="resultFrame"
        src="result.html"
        width="500"
        height="150"
        title="Form Result">
    </iframe>

</body>
</html>
