<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>

    <h1>File Upload</h1>

    <form>

        <label for="file">Choose File:</label>

        <input
            type="file"
            id="file"
            name="file"
            accept=".jpg,.png">

        <br><br>

        <button type="submit">Upload</button>

    </form>

    <p>Only JPG and PNG image files are allowed.</p>

</body>
</html>
