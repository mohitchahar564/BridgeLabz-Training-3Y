<!DOCTYPE html>
<html lang="en">
<head>

    <!-- The title tag defines the title of the webpage. -->
    <title>Important Head Elements</title>

    <!-- The meta charset tag defines the character encoding. -->
    <meta charset="UTF-8">

    <!-- The meta description tag describes the webpage. -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">

    <!-- The meta author tag identifies the author of the webpage. -->
    <meta
        name="author"
        content="Mohit Chahar">

    <!-- The base tag sets the base URL for relative URLs. -->
    <base href="https://example.com/">

    <!-- The link tag connects an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag contains CSS. It is empty as required. -->
    <style>
    </style>

    <!-- The script tag contains JavaScript. It is empty as required. -->
    <script>
    </script>

</head>
<body>

    <h1>Important Head Elements</h1>

    <p>
        This page demonstrates important HTML head elements.
    </p>

</body>
</html>
