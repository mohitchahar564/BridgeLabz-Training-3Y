<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>

<!-- Top frame for navigation and bottom frame for website message -->
<frameset rows="25%,75%">

    <!-- Top frame contains navigation links -->
    <frame
        src="navigation.html"
        name="navigation"
        title="Navigation">

    <!-- Bottom frame displays the welcome message -->
    <frame
        src="welcome.html"
        name="content"
        title="Welcome">

</frameset>

</html>
