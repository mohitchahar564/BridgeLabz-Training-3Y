<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>

    <h1>Form Security Example</h1>

    <form autocomplete="off">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required>

        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required>

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

    <p>
        Turning off autocomplete can improve security by reducing the
        chance of sensitive form information being automatically stored
        or filled in by the browser.
    </p>

</body>
</html>
