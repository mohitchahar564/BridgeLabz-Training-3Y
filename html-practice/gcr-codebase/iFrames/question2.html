<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <h1>My City - Agra</h1>

    <!-- loading="lazy" makes the iframe load only when it is close to being viewed. -->
    <iframe
        src="https://www.google.com/maps?q=Agra%2C%20Uttar%20Pradesh&output=embed"
        title="Google Map of Agra"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
