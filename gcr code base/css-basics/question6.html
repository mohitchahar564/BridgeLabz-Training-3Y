<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Photo Gallery</title>

    <link rel="stylesheet" href="question6.css">
</head>

<body>

    <main class="gallery-section">

        <h1>My Photo Gallery</h1>

        <section class="gallery">

            <!-- Image 1 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
                <div class="caption">Mountain Landscape</div>
            </div>

            <!-- Image 2 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1016/600/400" alt="Beautiful nature">
                <div class="caption">Beautiful Nature</div>
            </div>

            <!-- Image 3 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1025/600/400" alt="Pet portrait">
                <div class="caption">Pet Portrait</div>
            </div>

            <!-- Image 4 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1035/600/400" alt="River and mountains">
                <div class="caption">River View</div>
            </div>

            <!-- Image 5 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
                <div class="caption">Green Forest</div>
            </div>

            <!-- Image 6 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1050/600/400" alt="Animal">
                <div class="caption">Wildlife</div>
            </div>

            <!-- Image 7 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1069/600/400" alt="City architecture">
                <div class="caption">City Architecture</div>
            </div>

            <!-- Image 8 -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1074/600/400" alt="Nature view">
                <div class="caption">Nature View</div>
            </div>

        </section>

    </main>

</body>
</html>
